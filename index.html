[data-theme="forest"]{--accent:#22b36a;--accent2:#9be03a;--a0:#22b36a;--a1:#8bd12c;--a2:#12a89a;--a3:#e8a317;--a4:#5fbf3b;--a5:#0fa37f}
[data-theme="candy"]{--accent:#ff4fa3;--accent2:#5fd8f0;--a0:#ff4fa3;--a1:#42c6e6;--a2:#ffc82e;--a3:#a77bff;--a4:#3fd9a0;--a5:#ff8a9a}
[data-theme="aurora"]{--accent:#9b5de5;--accent2:#00f5d4;--a0:#9b5de5;--a1:#00d1b5;--a2:#f15bb5;--a3:#f5c800;--a4:#00a8e8;--a5:#fb5607}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg1);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%)}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 12px)}
.screen.on{display:flex;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg .fill{fill:currentColor}
.muted{color:var(--muted)} small{color:var(--muted)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.flip{transform:scaleX(-1)}
.spacer{width:44px}

/* buttons */
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.icon-btn:active,.btn:active,.tool:active,.pill:active{transform:scale(.96)}
.btn{min-height:52px;padding:0 20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);font-weight:650;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;box-shadow:0 10px 28px -10px var(--accent)}
.btn.primary small{color:rgba(255,255,255,.85)}
.btn.ghost{background:transparent}
.btn.big{min-height:76px;font-size:24px;font-weight:800;letter-spacing:.3px;flex-direction:row}
.btn.big small{font-size:13px;font-weight:600;margin-left:4px}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card-btn{flex-direction:column;gap:6px;min-height:84px;position:relative;font-size:15px}
.card-btn .badge{top:8px;right:10px}
.pill{display:flex;align-items:center;gap:8px;padding:0 14px;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-weight:650;position:relative}
.pill.static{pointer-events:none}
.pill svg{width:20px;height:20px}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb300);box-shadow:inset 0 0 0 2px #e69500}
.badge{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--danger);display:none;box-shadow:0 0 0 3px var(--bg1)}
.badge.on{display:block}

/* home */
.topbar{display:flex;justify-content:space-between;align-items:center}
.logo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.logo-mark{width:min(34vw,150px);height:auto;stroke:none}
.lm{fill:none;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.lm.a{stroke:var(--a0)}.lm.b{stroke:var(--a1)}
.lm.tip{fill:var(--a0);stroke:var(--a0);stroke-width:4}.lm.tip2{fill:var(--a1);stroke:var(--a1);stroke-width:4}
.lm.a{stroke-dasharray:160;animation:draw 2.6s ease-in-out infinite alternate}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.logo h1{font-size:clamp(40px,12vw,58px);letter-spacing:8px;font-weight:900;margin-top:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:8px}
.logo p{color:var(--muted);letter-spacing:3px;font-size:13px;text-transform:uppercase;margin-top:2px}
.home-actions{display:flex;flex-direction:column;gap:12px;padding-bottom:58px}
.corner{position:absolute;left:16px;bottom:calc(var(--safe-b) + 12px)}

/* generic screens */
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar h2{font-size:20px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h4{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:10px}
.pager{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv{aspect-ratio:1;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:750;font-size:18px}
.lv small{font-size:10px;letter-spacing:1px;color:#ffc83d}
.lv.cur{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}
.lv.cur small{color:#fff}
.lv.lock{opacity:.35}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:10px;font-weight:650;color:var(--muted)}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;min-height:48px}
.set-row+.set-row{border-top:1px solid var(--line)}
.switch{width:52px;height:30px;border-radius:15px;background:var(--card2);border:1px solid var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .2s}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(22px)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme{border-radius:16px;padding:10px 6px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:650}
.theme.on{border-color:var(--accent)}
.sw{display:flex;gap:3px}.sw i{width:14px;height:14px;border-radius:50%}
.bar-bg{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar-bg i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
.ach{display:flex;gap:12px;align-items:center}
.ach .ic{width:46px;height:46px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none;font-size:22px}
.ach.done .ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.ach .tx{flex:1;min-width:0}.ach b{display:block}.ach small{display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{font-size:24px;display:block}.stat small{font-size:12px}
.avatar{width:84px;height:84px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;font-size:36px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
input.name{width:100%;text-align:center;font:inherit;font-size:20px;font-weight:700;color:var(--text);background:transparent;border:0;border-bottom:2px solid var(--line);padding:6px;outline:none;-webkit-user-select:text;user-select:text}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.week div{aspect-ratio:1;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:700}
.week div.done{background:var(--ok);color:#06331f}
.week div.today{outline:2px solid var(--accent)}
.rowlist .r{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rowlist .r:first-child{border-top:0}

/* game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hud-mid{text-align:center;flex:1}
#hudTitle{font-weight:800;font-size:18px}
.hud-sub{display:flex;gap:12px;justify-content:center;font-size:13px;color:var(--muted);min-height:18px}
.hud-left{width:44px;text-align:center;line-height:1}.hud-left b{font-size:20px;display:block}.hud-left small{font-size:11px}
.tip{margin:8px 4px 0;padding:10px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:14px;text-align:center;animation:fade .3s}
#board{flex:1;min-height:0;position:relative;margin:6px 0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{height:60px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:650;position:relative;gap:1px}
.tool svg{width:22px;height:22px}
.tool b{position:absolute;top:-6px;right:8px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
.heart{color:var(--danger);letter-spacing:2px}.heart.off{opacity:.25}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,7,20,.6);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s}
.overlay[hidden]{display:none}
.modal{width:100%;max-width:380px;background:var(--modal);border:1px solid var(--line);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:24px}
.stars{display:flex;justify-content:center;gap:8px;margin:2px 0 4px}
.stars svg{width:50px;height:50px;stroke:#ffc83d;fill:none;opacity:.35;transform:scale(.6)}
.stars svg.on{fill:#ffc83d;opacity:1;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:var(--d)}
@keyframes starpop{from{transform:scale(.2) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.reward-days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rd{border-radius:14px;padding:8px 2px;background:var(--card2);font-size:12px;border:2px solid transparent}
.rd b{display:block;font-size:18px}.rd.cur{border-color:var(--accent)}.rd.got{opacity:.45}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translateX(-50%);background:var(--modal);border:1px solid var(--line);padding:12px 18px;border-radius:16px;z-index:40;font-weight:650;max-width:88vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:fade .2s}
.toast[hidden]{display:none}
@media (max-height:620px){.logo-mark{width:90px}.btn.big{min-height:62px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
[hidden]{display:none!important}

.corner.r{left:auto;right:16px}
.faces{display:flex;justify-content:space-between;gap:6px}
.face{flex:1;height:56px;border-radius:16px;background:var(--card2);border:2px solid transparent;font-size:28px}
.face.on{border-color:var(--accent);transform:scale(1.06)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:20px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
#fbText{width:100%;font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;resize:none;outline:none;-webkit-user-select:text;user-select:text}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:110px;height:110px;fill:none;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
#splash b{letter-spacing:9px;font-size:26px;padding-left:9px;color:var(--text)}
html,body{overscroll-behavior:none}
/* tip floats above the board so showing or hiding it can NEVER move the board under a finger */
.tip{position:absolute;left:16px;right:16px;bottom:calc(var(--safe-b) + 84px);margin:0;z-index:6;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35);background:var(--modal)}
.toast{pointer-events:none}

.prod{display:flex;align-items:center;gap:12px;justify-content:space-between}
.prod .pt{min-width:0}.prod .pt .muted{font-size:13px;margin-top:2px}
.prod .price{flex:none;min-height:44px;padding:0 16px;font-size:15px}
.prod .own{flex:none;color:var(--ok);font-weight:700}

.bar-track{height:10px;border-radius:6px;background:var(--line);margin:10px 0 6px;overflow:hidden}.bar-track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.trow{display:grid;grid-template-columns:32px 1fr 1fr;gap:8px;align-items:stretch;margin:8px 0}.tn{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted,#888)}
.tcell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650;min-height:62px;justify-content:space-between}
.tcell.done{opacity:.55}.tcell small{color:var(--muted,#888)}.btn.mini{padding:6px 10px;min-height:0;font-size:13px}
.theme .sw i{min-width:10px}
</style>
</head>
<body>
<div id="app">
  <div id="splash"><svg viewBox="0 0 120 120"><path d="M20 78H62V40H92" stroke="var(--a0)"/><path d="M86 26L104 40L86 54Z" fill="var(--a0)" stroke="var(--a0)"/><path d="M20 100H78" stroke="var(--a1)"/><path d="M74 90L90 100L74 110Z" fill="var(--a1)" stroke="var(--a1)"/></svg><b>VECTRA</b></div>

  <!-- HOME -->
  <section class="screen" id="s-home">
    <div class="topbar">
      <button class="pill" data-a="reward" id="btnReward"><span data-icon="gift"></span><span>Reward</span><i class="badge" id="rewardBadge"></i></button>
      <button class="pill" data-a="shop" aria-label="Shop"><span class="coin"></span><b id="homeCoins">0</b><span style="font-weight:800;color:var(--accent)">+</span></button>
    </div>
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 120 120" aria-hidden="true">
        <path class="lm a" d="M20 78 H62 V40 H92" /><path class="lm tip" d="M86 26 L104 40 L86 54 Z"/>
        <path class="lm b" d="M20 100 H78" /><path class="lm tip2" d="M74 90 L90 100 L74 110 Z"/>
      </svg>
      <h1>VECTRA</h1>
      <p>Arrow Escape Puzzle</p>
    </div>
    <div id="banner" class="tip" hidden></div>
    <div class="home-actions">
      <button class="btn primary big" data-a="play"><span data-icon="play"></span><span>Play</span><small id="playLvl">Level 1</small></button>
      <div class="grid2">
        <button class="btn card-btn" data-a="daily"><span data-icon="calendar"></span><span>Daily</span><i class="badge" id="dailyBadge"></i></button>
        <button class="btn card-btn" data-a="levels"><span data-icon="grid"></span><span>Levels</span></button>
        <button class="btn card-btn" data-a="ach"><span data-icon="trophy"></span><span>Trophies</span></button>
        <button class="btn card-btn" data-a="profile"><span data-icon="user"></span><span>Profile</span></button>
        <button class="btn card-btn" data-a="pass" style="grid-column:1/-1;min-height:60px;flex-direction:row;gap:10px"><span>🎟️</span><span>Season Pass</span></button>
      </div>
    </div>
    <button class="icon-btn corner" data-a="settings" data-icon="sliders" aria-label="Settings"></button>
    <button class="icon-btn corner r" data-a="feedback" data-icon="chat" aria-label="Send feedback"></button>
  </section>

  <!-- LEVELS -->
  <section class="screen" id="s-levels">
    <header class="bar"><button class="icon-btn" data-a="home" data-icon="back" aria-label="Back"></button><h2>Levels</h2><span class="spacer"></span></header>
    <div class="pager"><button class="icon-btn" data-a="pagePrev" data-icon="back"></button><b id="pageLabel">1-50</b><button class="icon-btn flip" data-a="pageNext" data-icon="back"></button></div>
    <div class="scroll"><div id="levelGrid" class="level-grid"></div></div>
  </section>

  <!-- DAILY -->
  <section class="screen" id="s-daily">
    <header class="bar"><button class="icon-btn" data-a="home" data-icon="back" aria-label="Back"></button><h2>Daily Challenge</h2><span class="spacer"></span></header>
    <div class="scroll" id="dailyBody"></div>
  </section>

  <!-- ACHIEVEMENTS -->
  <section class="screen" id="s-ach">
    <header class="bar"><button class="icon-btn" data-a="home" data-icon="back" aria-label="Back"></button><h2>Achievements</h2><span class="spacer"></span></header>
    <div class="scroll" id="achBody"></div>
  </section>

  <!-- PROFILE -->
  <section class="screen" id="s-profile">
    <header class="bar"><button class="icon-btn" data-a="home" data-icon="back" aria-label="Back"></button><h2>Profile</h2><span class="spacer"></span></header>
    <div class="scroll" id="profileBody"></div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="s-settings">
    <header class="bar"><button class="icon-btn" data-a="home" data-icon="back" aria-label="Back"></button><h2>Settings</h2><span class="spacer"></span></header>
    <div class="scroll" id="settingsBody"></div>
  </section>

  <!-- SHOP -->
  <section class="screen" id="s-shop">
    <header class="bar"><button class="icon-btn" data-a="home" data-icon="back" aria-label="Back"></button><h2>Shop</h2><span class="spacer"></span></header>
    <div class="scroll" id="shopBody"></div>
  </section>

  <!-- SEASON PASS -->
  <section class="screen" id="s-pass">
    <header class="bar"><button class="icon-btn" data-a="home" data-icon="back" aria-label="Back"></button><h2>Season Pass</h2><span class="spacer"></span></header>
    <div class="scroll" id="passBody"></div>
  </section>

  <!-- FEEDBACK -->
  <section class="screen" id="s-feedback">
    <header class="bar"><button class="icon-btn" data-a="home" data-icon="back" aria-label="Back"></button><h2>Feedback</h2><span class="spacer"></span></header>
    <div class="scroll" id="fbBody"></div>
  </section>

  <!-- GAME -->
  <section class="screen" id="s-game">
    <header class="hud">
      <button class="icon-btn" data-a="pause" data-icon="pause" aria-label="Pause"></button>
      <div class="hud-mid"><div id="hudTitle">Level 1</div><div class="hud-sub"><span id="hudHearts"></span><span id="hudTime">0:00</span></div></div>
      <div class="hud-left"><b id="hudLeft">0</b><small>left</small></div>
    </header>
    <div id="tip" class="tip" hidden></div>
    <div id="board"><canvas id="cv" aria-label="Puzzle board"></canvas></div>
    <footer class="tools">
      <button class="tool" data-a="undo"><span data-icon="undo"></span><span>Undo</span><b id="undoCount">3</b></button>
      <button class="tool" data-a="hint"><span data-icon="bulb"></span><span>Hint</span><b id="hintCount">3</b></button>
      <button class="tool" data-a="skip"><span data-icon="skip"></span><span>Skip</span></button>
      <button class="tool" data-a="restart"><span data-icon="restart"></span><span>Restart</span></button>
    </footer>
  </section>

  <!-- OVERLAYS -->
  <div class="overlay" id="o-pause" hidden>
    <div class="modal"><h3>Paused</h3>
      <button class="btn primary" data-a="resume">Resume</button>
      <button class="btn" data-a="restart">Restart level</button>
      <div class="row2"><button class="btn" data-a="togSound" id="pSound">Sound: on</button><button class="btn" data-a="togHaptic" id="pHaptic">Haptics: on</button></div>
      <button class="btn ghost" data-a="home">Quit to menu</button>
    </div>
  </div>
  <div class="overlay" id="o-win" hidden><div class="modal" id="winBody"></div></div>
  <div class="overlay" id="o-fail" hidden>
    <div class="modal"><h3>Out of hearts</h3><p class="muted">Every blocked tap costs a heart in Classic mode. Try again, or switch to Zen mode in Settings for a relaxed game.</p>
      <button class="btn primary" id="reviveBtn" data-a="revive">▶ Continue with 1 heart (🪙 or ad)</button><button class="btn" data-a="restart">Try again</button><button class="btn ghost" data-a="home">Menu</button></div>
  </div>
  <div class="overlay" id="o-reward" hidden><div class="modal" id="rewardBody"></div></div>
  <div class="overlay" id="o-confirm" hidden><div class="modal" id="confirmBody"></div></div>

    for (i = 0; i < particles.length; i++) { var q = particles[i]; cx.globalAlpha = Math.max(0, q.life / .5); cx.fillStyle = q.c; cx.beginPath(); cx.arc(LAY.ox + q.x * u, LAY.oy + q.y * u, u * .06, 0, 6.3); cx.fill(); }
    for (i = 0; i < floats.length; i++) { var f = floats[i], k2 = (now - f.t0) / 1000; cx.globalAlpha = 1 - k2 * k2; cx.font = '800 ' + Math.round(26 + Math.min(f.n, 8) * 2) + 'px system-ui'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.lineJoin = 'round'; cx.lineWidth = 5; cx.strokeStyle = col.accent; cx.strokeText(f.text, W / 2, 34 - k2 * 22); cx.fillStyle = '#fff'; cx.fillText(f.text, W / 2, 34 - k2 * 22); }
    cx.globalAlpha = 1;
  }

  /* ---------- input: tap on release, with tolerance, so no accidental picks ---------- */
  // Review fixes: (1) every finger tracked separately so fast tapping never drops a tap,
  // (2) a tap only counts if it lands ON an arrow's body (distance to the arrow line),
  // so empty space and neighbouring arrows are never selected by accident.
  var downs = {};
  cv.addEventListener('pointerdown', function (e) { downs[e.pointerId] = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  cv.addEventListener('pointercancel', function (e) { delete downs[e.pointerId]; });
  cv.addEventListener('pointerleave', function (e) { delete downs[e.pointerId]; });
  cv.addEventListener('pointerup', function (e) {
    var d0 = downs[e.pointerId]; delete downs[e.pointerId];
    if (!d0 || !G || !G.running || G.over) return;
    var dx = e.clientX - d0.x, dy = e.clientY - d0.y;
    if (dx * dx + dy * dy > 18 * 18 || performance.now() - d0.t > 800) return; // a drag or long press is not a tap
    var r = cv.getBoundingClientRect(), gx = (e.clientX - r.left - LAY.ox) / LAY.u, gy = (e.clientY - r.top - LAY.oy) / LAY.u;
    var id = pick(gx, gy); if (id >= 0) tapArrow(id);
  });
  function segDist(px, py, ax, ay, bx, by) {
    var vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy, t = l2 ? Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / l2)) : 0;
    var qx = ax + vx * t - px, qy = ay + vy * t - py; return Math.sqrt(qx * qx + qy * qy);
  }
  function pick(gx, gy) {
    var lv = G.lv, best = -1, limit = Math.max(0.3, 16 / LAY.u); // about 16px (or 0.3 cell) around the arrow line
    for (var i = 0; i < lv.arrows.length; i++) {
      if (G.gone[i]) continue;
      var pts = lv.arrows[i]._pts, d = 9;
      for (var k = 1; k < pts.length; k++) d = Math.min(d, segDist(gx, gy, pts[k - 1][0], pts[k - 1][1], pts[k][0], pts[k][1]));
      if (pts.length === 1) d = Math.sqrt((gx - pts[0][0]) * (gx - pts[0][0]) + (gy - pts[0][1]) * (gy - pts[0][1]));
      if (d < limit) { limit = d; best = i; }
    }
    return best;
  }
  function burst(a) {
    if (S.settings.saver) return;
    var hc = a.cells[a.cells.length - 1], c = col.arrows[(a.id * 7 + a.cells.length) % col.arrows.length];
    for (var i = 0; i < 7; i++) { var ang = Math.random() * 6.28, sp = 1.5 + Math.random() * 2; particles.push({ x: hc[0] + .5, y: hc[1] + .5, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: .5, c: c }); }
  }
  function tapArrow(id) {
    var lv = G.lv, a = lv.arrows[id], now = performance.now();
    hintSt = null; $('#tip').hidden = true;
    if (C.isFree(lv, G.occ, G.cnt, a, G.gone)) {
      a.cells.forEach(function (c) { G.occ[c[1] * lv.w + c[0]] = -1; });
      G.gone[id] = 1; G.cnt++; G.taps++; G.hist.push(id); G.slides.push({ id: id, t0: now, s: 0 });
      S.stats.taps++; if (a.lock) S.stats.locks++;
      G.combo = (now - G.lastTap < 1400 && G.combo > 0) ? G.combo + 1 : 1; G.lastTap = now; G.maxCombo = Math.max(G.maxCombo, G.combo);
      if (G.combo >= 3) { G.bonus += 1; floats = [{ text: 'Combo x' + G.combo + '!', t0: now, n: G.combo }]; }
      burst(a); sfx.go(G.combo); buzz(G.combo >= 3 ? [10, 20, 14] : 12); hud(); kick();
      if (G.cnt === G.n) { G.running = false; G.acc += performance.now() - G.t0; G.over = true; setTimeout(win, 600); }
    } else {
      G.combo = 0; G.mistakes++; S.stats.blocked++; shakeSt = { id: id, t0: now };
      if (a.lock > G.cnt) toast('Locked: ' + (a.lock - G.cnt) + ' more arrow' + (a.lock - G.cnt > 1 ? 's' : '') + ' must leave first');
      else if (a.req >= 0 && !G.gone[a.req]) { flashSt = { id: a.req, t0: now }; toast('Linked: free the flashing arrow first'); }
      else {
        var ray = C.rayCells(lv, a), bl = -1; for (var i = 0; i < ray.length; i++) { var o = G.occ[ray[i][1] * lv.w + ray[i][0]]; if (o >= 0) { bl = o; break; } }
        if (bl >= 0) flashSt = { id: bl, t0: now };
      }
      sfx.bad(); buzz([18, 40, 18]);
      if (G.classic) { G.hearts--; if (G.hearts <= 0) { G.running = false; G.over = true; hud(); sfx.lose(); buzz(120); setTimeout(function () { $('#reviveBtn').hidden = !!G.revived; ov('o-fail', true); }, 450); } }
      hud(); kick();
    }
    save();
  }

  /* ---------- tools ---------- */
  // Coins are useful: spend them, or watch a short ad for the same thing for free.
  function spendOrAd(title, cost, give, onCancel) {
    var can = S.coins >= cost;
    $('#confirmBody').innerHTML = '<h3>' + title + '</h3><p class="muted">You have 🪙 ' + S.coins + '</p><button class="btn primary" id="cfCoin"' + (can ? '' : ' disabled') + '>Use ' + cost + ' 🪙' + (can ? '' : ' (not enough)') + '</button><button class="btn" id="cfAd">▶ Watch a short ad (free)</button><button class="btn ghost" id="cfNo">Cancel</button>';
    ov('o-confirm', true);
    $('#cfCoin').onclick = function () { ov('o-confirm', false); S.coins -= cost; save(); give(); };
    $('#cfAd').onclick = function () { ov('o-confirm', false); rewardedAd(give); };
    $('#cfNo').onclick = function () { ov('o-confirm', false); if (onCancel) onCancel(); };
  }
  function doUndo() {
    if (!G || G.over || !G.hist.length) { toast('Nothing to undo'); return; }
    if (S.undos <= 0) { spendOrAd('Out of undos', CFG.costUndo, function () { S.undos++; save(); hud(); toast('+1 undo'); }); return; }
    var id = G.hist.pop(), a = G.lv.arrows[id];
    G.slides = G.slides.filter(function (s) { return s.id !== id; });
    a.cells.forEach(function (c) { G.occ[c[1] * G.lv.w + c[0]] = id; });
    G.gone[id] = 0; G.cnt--; S.undos--; sfx.click(); buzz(8); save(); hud(); kick();
  }
  function doHint() {
    if (!G || G.over) return;
    if (S.hints <= 0) { spendOrAd('Out of hints', CFG.costHint, function () { S.hints++; save(); hud(); toast('+1 hint'); }); return; }
    var sol = G.lv.solution, id = -1; for (var i = 0; i < sol.length; i++) if (!G.gone[sol[i]]) { id = sol[i]; break; }
    if (id < 0) return;
    S.hints--; G.hintsUsed++; S.stats.hints++; hintSt = { id: id, t0: performance.now() }; sfx.click(); buzz(10); save(); hud(); kick();
  }

  /* ---------- win ---------- */
  function win() {
    var errs = G.mistakes + G.hintsUsed, stars = errs === 0 ? 3 : errs <= 2 ? 2 : 1, lv = G.lv, ms = G.acc;
    if (G.skipped) stars = 1;
    var coins = G.skipped ? 0 : CFG.winCoins + stars * CFG.starCoins + Math.min(G.bonus, 15), key = 'd' + S.settings.diff + ':' + lv.level, first, newBest = false;
    if (lv.kind === 'boss' && !G.skipped && !G.daily) coins += 20;
    S.perfectStreak = stars === 3 ? (S.perfectStreak || 0) + 1 : 0;
    var psb = stars === 3 ? Math.min(S.perfectStreak, 5) : 0; coins += psb;
    S.stats.won++; S.coins += coins;
    if (G.daily) {
      first = !S.daily.done[G.daily];
      if (first) {
        S.daily.streak = S.daily.last === daysAgo(1) ? S.daily.streak + 1 : 1; S.daily.last = G.daily;
        S.stats.bestStreak = Math.max(S.stats.bestStreak, S.daily.streak); S.stats.dailyWon++;
        S.daily.done[G.daily] = { time: ms, stars: stars }; S.coins += CFG.dailyBonus; coins += CFG.dailyBonus;
      }
    } else {
      if (stars > (S.stars[key] || 0)) { if (stars === 3 && (S.stars[key] || 0) < 3) S.stats.perfect++; S.stars[key] = stars; newBest = true; }
      if (lv.level >= S.unlocked) S.unlocked = Math.min(C.MAX_LEVEL, lv.level + 1);
      if (lv.level >= 10 && ms < 15000) S.stats.fast = 1;
      S.sinceAd++;
    }
    var xp = G.skipped ? 0 : (G.daily ? 50 : 20 + stars * 5); if (xp) addXp(xp);
    checkAch(); save();
    sfx.win(); buzz([30, 50, 30, 50, 80]);
    var body = '<h3>' + (G.daily ? 'Daily complete!' : lv.kind === 'boss' ? '👹 Boss defeated!' : 'Level ' + lv.level + ' clear!') + '</h3><div class="stars">' +
      [0, 1, 2].map(function (i) { return STAR.replace('<svg', '<svg class="' + (i < stars ? 'on' : '') + '" style="--d:' + (0.15 + i * 0.22) + 's"'); }).join('') + '</div>' +
      '<p class="muted">' + fmt(ms) + ' · ' + G.taps + ' taps · +' + coins + ' 🪙' + (xp ? ' · +' + xp + ' XP' : '') + '</p><p class="muted">' + (G.maxCombo >= 3 ? '⚡ Best combo x' + G.maxCombo : 'Tap fast for combos') + (psb > 1 ? ' · 💎 Perfect streak ' + S.perfectStreak : '') + (G.daily ? ' · 🔥 ' + S.daily.streak + ' day streak' : '') + '</p>';
    lastWinCoins = coins;
    if (coins > 0 && !G.skipped) body += '<button class="btn" id="dblBtn" data-a="dblWin">▶ Double coins (+' + coins + ')</button>';
    if (G.daily) body += '<button class="btn primary" data-a="home">Done</button><button class="btn ghost" data-a="daily">Daily screen</button>';
    else {
      if (S.stats.won % CFG.chestEvery === 0) body += '<div id="chestBox"><button class="btn" data-a="chest">🎁 Open your reward chest</button></div>';
      body += '<button class="btn primary big" data-a="next">Next level ▶</button>';
    }
    $('#winBody').innerHTML = body; ov('o-win', true);
    var cc = [col.accent, col.accent2].concat(col.arrows);
    for (var ci = 0; ci < 60; ci++) particles.push({ x: Math.random() * lv.w, y: -1 - Math.random() * 2, vx: (Math.random() - .5) * 2, vy: 3 + Math.random() * 5, life: 1.6, c: cc[ci % cc.length] });
    kick();
    [0, 1, 2].forEach(function (i) { if (i < stars) setTimeout(function () { sfx.star(i); }, 150 + i * 220); });
    if (!G.daily && lv.level >= 5 && !S.fbAsked) {
      S.fbAsked = 1; save();
      setTimeout(function () { if ($('#o-win').hidden) return; confirmBox('Enjoying Vectra?', 'Tell us what you like and what to fix. It takes 20 seconds and gives +20 coins.', 'Send feedback', function () { ov('o-win', false); show('feedback'); }); }, 1800);
    }
  }

  /* ---------- actions (event delegation) ---------- */
  var lastChest = null, lastWinCoins = 0;
  function applyReward(r) { S.coins += r.c || 0; S.hints += r.h || 0; S.undos += r.u || 0; save(); renderHomeIfNeeded(); if (G) hud(); }
  function renderHomeIfNeeded() { if (current === 'home') renderHome(); }
  function rewardLabel(r) { return r.c ? '🪙 ' + r.c + ' coins' : r.h ? '💡 ' + r.h + ' hint' + (r.h > 1 ? 's' : '') : '↩️ ' + r.u + ' undos'; }
  function openChest() {
    var x = Math.random(), span = Math.max(0, CFG.chestMax - CFG.chestMin);
    var r = x < .5 ? { c: CFG.chestMin + Math.floor(Math.random() * (span + 1)) } : x < .8 ? { h: 1 + Math.floor(Math.random() * 2) } : { u: 2 };
    lastChest = r; applyReward(r); sfx.win(); buzz([20, 40, 20]);
    $('#chestBox').innerHTML = '<p style="font-size:20px;font-weight:800">You got ' + rewardLabel(r) + '!</p>' +
      (S.settings.ads ? '<button class="btn" data-a="chest2">▶ Watch a short ad to double it</button>' : '<button class="btn" data-a="chest2">Double it (Premium)</button>');
  }
  function doubleChest() { rewardedAd(function () { applyReward(lastChest); sfx.win(); $('#chestBox').innerHTML = '<p style="font-size:20px;font-weight:800">Doubled! +' + rewardLabel(lastChest) + '</p>'; }); }
  function setPause(on) {
    if (!G || G.over) return;
    if (on) { G.acc += performance.now() - G.t0; G.running = false; ov('o-pause', true); refreshPauseBtns(); }
    else { G.t0 = performance.now(); G.running = true; ov('o-pause', false); }
  }
  function refreshPauseBtns() { $('#pSound').textContent = 'Sound: ' + (S.settings.sound ? 'on' : 'off'); $('#pHaptic').textContent = 'Haptics: ' + (S.settings.haptics ? 'on' : 'off'); }
  function restart() {
    if (!G) return; var lv = G.daily ? C.dailyLevel(G.daily) : C.getLevel(G.lv.level, S.settings.diff), d = G.daily;
    startGame(lv, d ? { daily: d } : null);
  }
  function goHome() { if (G) { G.running = false; G.over = true; } ov('o-pause', false); ov('o-win', false); ov('o-fail', false); clearInterval(timerIv); show('home'); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el) return;
    var a = el.getAttribute('data-a'); sfx.click(); musicStart();
    switch (a) {
      case 'play': startLevel(S.unlocked); break;
      case 'levels': page = Math.floor((S.unlocked - 1) / 50); show('levels'); break;
      case 'daily': ov('o-win', false); show('daily'); break;
      case 'playDaily': startGame(C.dailyLevel(today()), { daily: today() }); break;
      case 'ach': show('ach'); break; case 'profile': show('profile'); break; case 'settings': show('settings'); break;
      case 'home': goHome(); break;
      case 'pagePrev': page--; renderLevels(); break; case 'pageNext': page++; renderLevels(); break;
      case 'lv': var n = +el.getAttribute('data-n'); if (n > S.unlocked) toast('Clear level ' + S.unlocked + ' first'); else startLevel(n); break;
      case 'pause': setPause(true); break; case 'resume': setPause(false); break;
      case 'restart': ov('o-pause', false); ov('o-fail', false); ov('o-win', false); restart(); break;
      case 'next': ov('o-win', false); interstitial(function () { startLevel(G.lv.level + 1); }); break;
      case 'revive': ov('o-fail', false); spendOrAd('Continue with 1 heart', CFG.costRevive, function () { G.revived = true; G.hearts = 1; G.over = false; G.running = true; G.t0 = performance.now(); hud(); toast('Back in! 1 heart'); }, function () { ov('o-fail', true); }); break;
      case 'shop': show('shop'); break;
      case 'pass': show('pass'); break;
      case 'passClaim': passClaim(+el.getAttribute('data-t'), el.getAttribute('data-k')); break;
      case 'deal': confirmBox('Today\'s deal', 'Test purchase. No real money is used in this prototype.', 'Buy (test)', grantDeal); break;
      case 'invite': invite(); break;
      case 'skin':
        var sid = el.getAttribute('data-id'), sk2 = SKINS.filter(function (x) { return x.id === sid; })[0];
        if (S.skins.indexOf(sid) < 0) {
          if (sk2.pass) { toast('Unlock it with the Season Pass'); break; }
          if (S.coins < sk2.price) { toast('Need ' + (sk2.price - S.coins) + ' more coins'); break; }
          S.coins -= sk2.price; S.skins.push(sid);
        }
        S.skin = sid; save(); applyTheme(); renderSettings(); kick(); break;
      case 'buy': var pid = el.getAttribute('data-id'), pr = SHOP.filter(function (x) { return x.id === pid; })[0];
        confirmBox(pr.t, 'Test purchase. No real money is used in this prototype.', 'Buy (test)', function () { grant(pid); }); break;
      case 'claimPlus': if (plusActive() && S.plusClaim !== today()) { S.plusClaim = today(); S.hints += 2; save(); toast('+2 hints'); renderShop(); } break;
      case 'dblWin': rewardedAd(function () { S.coins += lastWinCoins; save(); var db = $('#dblBtn'); if (db) db.outerHTML = '<p style="font-weight:800">Doubled! +' + lastWinCoins + ' 🪙</p>'; sfx.win(); }); break;
      case 'dblReward': rewardedAd(function () { var rr = REWARDS[S.reward.day - 1]; if (rr && S.rewardDoubled !== today()) { S.rewardDoubled = today(); S.coins += rr.c || 0; S.hints += rr.h || 0; S.undos += rr.u || 0; save(); sfx.win(); toast('Doubled!'); openReward(); renderHome(); } }); break;
      case 'feedback': show('feedback'); break;
      case 'fbRate': fb.rating = +el.getAttribute('data-n'); renderFeedback(); break;
      case 'fbTag': var tg = el.getAttribute('data-t'), ti = fb.tags.indexOf(tg); if (ti >= 0) fb.tags.splice(ti, 1); else fb.tags.push(tg); renderFeedback(); break;
      case 'fbSend': sendFeedback(); break;
      case 'fbCopy': copyText(fbMessage()); break;
      case 'install': if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.then(function () { deferredInstall = null; renderSettings(); }); } break;
      case 'fullscreen': try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { toast('Full screen is not available here'); } break;
      case 'skip':
        if (!G || G.over) break;
        if (G.daily) { toast('The daily challenge cannot be skipped'); break; }
        spendOrAd('Skip this level? (no stars)', CFG.costSkip, function () { var L = G.lv.level; if (L >= S.unlocked) S.unlocked = Math.min(C.MAX_LEVEL, L + 1); save(); startLevel(L + 1); }); break;
      case 'chest': openChest(); break; case 'chest2': doubleChest(); break;
      case 'undo': doUndo(); break; case 'hint': doHint(); break;
      case 'reward': openReward(); break; case 'claim': claimReward(); break; case 'closeReward': ov('o-reward', false); break;
      case 'togSound': S.settings.sound = !S.settings.sound; save(); refreshPauseBtns(); break;
      case 'togHaptic': S.settings.haptics = !S.settings.haptics; save(); refreshPauseBtns(); buzz(15); break;
      case 'tog': S.settings[el.getAttribute('data-k')] = !S.settings[el.getAttribute('data-k')]; save(); renderSettings(); if (el.getAttribute('data-k') === 'saver') layout(); if (el.getAttribute('data-k') === 'music') { S.settings.music ? musicStart() : musicStop(); } break;
      case 'set': var k = el.getAttribute('data-k'), v = el.getAttribute('data-v'); S.settings[k] = (k === 'diff') ? +v : v; save(); if (k === 'appearance') applyTheme(); renderSettings(); break;
      case 'theme':
        var id = el.getAttribute('data-id'), t = THEMES.filter(function (x) { return x.id === id; })[0];
        if (S.owned.indexOf(id) < 0) {
          if (S.coins < t.price) { toast('Need ' + (t.price - S.coins) + ' more coins'); break; }
          S.coins -= t.price; S.owned.push(id); checkAch();
        }
        S.settings.theme = id; save(); applyTheme(); renderSettings(); break;
      case 'reset': confirmBox('Reset everything?', 'This deletes all progress, coins and achievements on this device.', 'Reset', function () { S = defSave(); save(); applyTheme(); show('home'); }); break;
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && G && G.running && current === 'game') setPause(true); });
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe($('#board'));
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- boot ---------- */
  if (!S.refCode) S.refCode = Math.random().toString(36).slice(2, 8);
  seasonSync();
  try {
    var rf = new URLSearchParams(location.search).get('ref');
    if (rf && !S.refBy && S.stats.played === 0 && rf !== S.refCode) { S.refBy = rf.slice(0, 12); S.coins += 100; setTimeout(function () { toast('Welcome gift from a friend: +100 coins'); }, 1200); }
  } catch (e) {}
  S.stats.firstDay = S.stats.firstDay || today(); S.stats.days = S.stats.days || [];
  if (S.stats.days.indexOf(today()) < 0) { S.stats.days.push(today()); S.stats.days = S.stats.days.slice(-60); }
  save();
  icons(document); applyTheme();
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () { if (S.settings.appearance === 'auto') applyTheme(); }); } catch (e) {} }
  show('home');
  if (S.reward.last !== today() && S.stats.played > 0) setTimeout(openReward, 400);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }

  // Android back button behaves like a real app: closes things, pauses the game, goes up a screen, and only exits from home.
  try { history.pushState({ v: 1 }, ''); } catch (e) {}
  window.addEventListener('popstate', function () {
    var open = $$('.overlay').filter(function (o) { return !o.hidden; });
    if (open.length) { var last = open[open.length - 1]; if (last.id === 'o-pause') setPause(false); else last.hidden = true; }
    else if (current === 'game') { if (G && G.running) setPause(true); else if (G && !G.over) setPause(false); }
    else if (current !== 'home') { goHome(); }
    else return; // on home: let the app close
    try { history.pushState({ v: 1 }, ''); } catch (e) {}
  });
  // Owner shortcut for testing: open the game with ?level=30 to jump straight to that level.
  try { var qn = parseInt(new URLSearchParams(location.search).get('level'), 10); if (qn > 0) { qn = Math.min(C.MAX_LEVEL, qn); S.unlocked = Math.max(S.unlocked, qn); save(); setTimeout(function () { startLevel(qn); }, 800); } } catch (e) {}
  var sp = $('#splash'); if (sp) setTimeout(function () { sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 400); }, 650);

  // Small hook used by automated tests.
  window.Vectra = { state: function () { return G; }, tap: tapArrow, save: function () { return S; }, startLevel: startLevel };
})();
</script>
</body>
